name: Apply physical-domain fix
on:
  push:
    branches: [main]
    paths:
      - apply_physical_domain_fix.py
      - .github/workflows/apply-physical-domain-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python apply_physical_domain_fix.py
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile rock_weibull_model.py microcrack_multifractal.py generate_microcrack_figure.py sensitivity_figures.py
      - run: |
          if grep -q '\\left\|\\right' README.md; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm apply_physical_domain_fix.py .github/workflows/apply-physical-domain-fix.yml
          git add README.md rock_weibull_model.py tests/test_weibull_boundaries.py
          git commit -m 'Correct physical solution domain and README rendering'
          git push
